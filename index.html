<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLoop Pro - Smart Waste Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <!-- Auth Modal -->
    <div id="auth-gate" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h2 class="text-2xl font-bold text-emerald-400 mb-2">Welcome to EcoLoop</h2>
            <p class="text-slate-400 text-xs mb-4">Enter details to access real-time waste trade & AI vision.</p>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <input type="text" id="u-name" placeholder="Full Name" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                <input type="tel" id="u-phone" placeholder="Phone Number" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                <input type="text" id="u-area" placeholder="City / Area" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-2.5 rounded-xl text-sm transition">Continue to App</button>
            </form>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-sm">♻️</div>
                <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">EcoLoop Pro</span>
            </div>
            <span id="user-badge" class="text-xs font-semibold bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">Guest</span>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-4 pb-20">
        <!-- Dashboard Overview -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
                <p class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">PET Plastic</p>
                <p id="price-pet" class="text-xl font-bold text-emerald-400 mt-1">Rs. 120/kg</p>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
                <p class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">Cardboard</p>
                <p id="price-cardboard" class="text-xl font-bold text-emerald-400 mt-1">Rs. 45/kg</p>
            </div>
        </section>

        <!-- AI Waste Classifier -->
        <section class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-sm text-slate-200">AI Scanner</h3>
                <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">MobileNet v2</span>
            </div>
            <div class="relative bg-slate-950 rounded-xl overflow-hidden aspect-video border border-slate-800 flex items-center justify-center">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                <div id="camera-placeholder" class="text-center p-4">
                    <p class="text-xs text-slate-500">Scan material to classify automatically</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="startCamera()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold py-2.5 rounded-xl border border-slate-700 transition">Open Camera</button>
                <button onclick="classifyImage()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold py-2.5 rounded-xl transition">Analyze Waste</button>
            </div>
            <div id="ai-result" class="text-xs text-slate-400 bg-slate-950 p-2.5 rounded-xl border border-slate-800 hidden"></div>
        </section>

        <!-- Map Section -->
        <section class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl space-y-3">
            <h3 class="font-bold text-sm text-slate-200">Collector Map</h3>
            <div id="map" class="h-44 rounded-xl border border-slate-800"></div>
        </section>

        <!-- Admin Control -->
        <section class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl space-y-3">
            <h3 class="font-bold text-sm text-slate-200">Admin Panel</h3>
            <div id="admin-lock" class="flex gap-2">
                <input type="password" id="admin-key" placeholder="Admin Key" class="flex-1 bg-slate-800 border border-slate-700 p-2 rounded-xl text-xs">
                <button onclick="unlockAdmin()" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 rounded-xl border border-slate-700">Unlock</button>
            </div>
            <div id="admin-dashboard" class="hidden space-y-3 pt-2 border-t border-slate-800">
                <p class="text-xs font-semibold text-emerald-400">Registered Users (Live Database)</p>
                <div id="user-registry" class="max-h-40 overflow-y-auto space-y-1.5 text-xs"></div>
            </div>
        </section>
    </main>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAoe0G3ozEBElszj1dtdY-yvtztYrjsCow",
            authDomain: "ecoloop-v-69658.firebaseapp.com",
            projectId: "ecoloop-v-69658",
            storageBucket: "ecoloop-v-69658.firebasestorage.app",
            messagingSenderId: "644855661630",
            appId: "1:644855661630:web:be06fc4089b07ac5c9bd6f",
            measurementId: "G-6J2S23PENM",
            databaseURL: "https://ecoloop-v-69658-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let activeUser = null;
        let model = null;
        const ADMIN_PASS = "mss@76";

        // Handle User Login & Firebase Persistence
        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('u-name').value;
            const phone = document.getElementById('u-phone').value;
            const area = document.getElementById('u-area').value;

            activeUser = { name, phone, area, joinedAt: new Date().toLocaleString() };
            
            // Save user to Cloud Database
            database.ref('users/' + phone.replace(/[^0-9]/g, '')).set(activeUser);

            document.getElementById('auth-gate').classList.add('hidden');
            document.getElementById('user-badge').innerText = activeUser.name;
        }

        // Camera & AI Classifier Setup
        async function startCamera() {
            const video = document.getElementById('webcam');
            const placeholder = document.getElementById('camera-placeholder');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                placeholder.classList.add('hidden');
                if(!model) model = await mobilenet.load();
            } catch(err) {
                alert("Camera access denied or unavailable.");
            }
        }

        async function classifyImage() {
            const video = document.getElementById('webcam');
            const resultDiv = document.getElementById('ai-result');
            if(!model || video.classList.contains('hidden')) {
                alert("Please open the camera first!");
                return;
            }
            resultDiv.classList.remove('hidden');
            resultDiv.innerText = "Analyzing material...";
            const predictions = await model.classify(video);
            if(predictions.length > 0) {
                resultDiv.innerHTML = `<strong>Detected:</strong> ${predictions[0].className}<br><strong>Confidence:</strong> ${(predictions[0].probability * 100).toFixed(1)}%`;
            }
        }

        // Map Initialization
        window.addEventListener('load', () => {
            const map = L.map('map').setView([6.9271, 79.8612], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([6.9271, 79.8612]).addTo(map).bindPopup('Central Recycling Hub').openPopup();
        });

        // Admin Dashboard Integration
        function unlockAdmin() {
            if(document.getElementById('admin-key').value === ADMIN_PASS) {
                document.getElementById('admin-lock').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');

                // Real-time synchronization with Firebase
                database.ref('users').on('value', (snapshot) => {
                    const users = snapshot.val();
                    let html = '';
                    if(users) {
                        for(let id in users) {
                            html += `
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                                    <p class="font-bold text-emerald-400">${users[id].name}</p>
                                    <p class="text-slate-400">Phone: ${users[id].phone} | Area: ${users[id].area}</p>
                                </div>
                            `;
                        }
                    } else {
                        html = '<p class="text-slate-500">No users found.</p>';
                    }
                    document.getElementById('user-registry').innerHTML = html;
                });
            } else {
                alert("Invalid Password!");
            }
        }
    </script>
</body>
</html>
